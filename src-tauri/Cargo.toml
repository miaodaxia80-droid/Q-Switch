[package]
name = "qswitch"
version = "3.19.0-qswitch.1"
description = "Qoder model configuration tool based on CC Switch"
authors = ["Jason Young"]
license = "MIT"
repository = "https://github.com/miaodaxia80-droid/Q-Switch"
edition = "2021"
rust-version = "1.85.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "qswitch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

[[bin]]
name = "qswitch"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-log", "dep:tauri-plugin-single-instance"]

[build-dependencies]
tauri-build = { version = "2.4.0", optional = true, features = [] }

[dependencies]
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
chrono = "0.4"
tauri = { version = "2.8.2", optional = true, features = ["tray-icon"] }
tauri-plugin-log = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
dirs = "5.0"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "socks"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time", "sync", "io-util"] }
futures = "0.3"
async-stream = "0.3"
bytes = "1.5"
axum = "0.7"
thiserror = "2.0"
tempfile = "3"
url = "2.5"
once_cell = "1.21.3"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1.11", features = ["v4"] }
sha2 = "0.10"

# Optimize release binary size to help reduce AppImage footprint
[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
# 使用 unwind 以便 panic hook 能捕获 backtrace（abort 会直接终止无法捕获）
panic = "unwind"
strip = "symbols"
